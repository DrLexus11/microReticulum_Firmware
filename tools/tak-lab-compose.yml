# The two services OpenTAKServer needs, so they survive a reboot without
# anybody remembering to start them.
#
#   docker compose -f tools/tak-lab-compose.yml up -d
#
# SteamOS has a read-only /usr, so neither of these can be installed natively.
# They are also the two things that made OTS fail in ways that named something
# else entirely: no broker, and a database without PostGIS.
#
# `impr-tak start` will use these if they are already running and fall back to
# creating standalone containers if they are not, so adopting compose is
# optional rather than a second way to do the same thing.

name: impr-tak

services:
  rabbitmq:
    # OTS exits rather than waits when the broker is absent, so it needs to be
    # up before opentakserver rather than eventually.
    image: rabbitmq:3-management
    container_name: impr-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      # The management UI, which is occasionally the fastest way to see whether
      # CoT is actually flowing through the queues.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    # PostGIS, not stock postgres: OTS stores positions as geography(POINT) and
    # a plain image fails at schema creation with `type "geography" does not
    # exist`, which reads like a driver problem and is not one.
    image: postgis/postgis:16-3.4
    container_name: impr-ots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ots
      POSTGRES_DB: ots
      # Read from the file impr-tak generates, so the password is not a
      # constant in version control that every install would share:
      #   POSTGRES_PASSWORD=$(cat ~/.impr-tak/postgres-password) docker compose ...
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run impr-tak once first, or set POSTGRES_PASSWORD}
    ports:
      # 5433, because 5432 belongs to another project on this machine and a lab
      # fixture has no business creating roles in it.
      - "5433:5432"
    volumes:
      - ots-pgdata:/var/lib/postgresql/data
    healthcheck:
      # From inside the container. impr-tak additionally waits on the published
      # port, because this says nothing about whether the host can connect --
      # OTS got "connection refused" on a database this check called ready.
      test: ["CMD-SHELL", "pg_isready -U ots -d ots -q"]
      interval: 5s
      timeout: 5s
      retries: 20

  ui:
    # OpenTAKServer serves only its API: / and /login are 404 because the
    # official install puts nginx in front with the built UI as static files.
    # This is that nginx. It proxies to OTS on the host rather than in a
    # container, because OTS is a venv on the host.
    image: nginx:alpine
    container_name: impr-ots-ui
    restart: unless-stopped
    ports:
      - "8182:8182"
    volumes:
      - ${OTS_UI_DIST:-/home/deck/projects/OpenTAKServer-UI/dist}:/usr/share/nginx/html:ro
      - ./tak-lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Linux docker has no host.docker.internal by default, and the proxy
      # targets need to reach OTS on the host.
      - "host.docker.internal:host-gateway"

volumes:
  ots-pgdata:
