# esptool configuration for flashing IMPR RAD-01 Rev 2 over an external
# USB-serial bridge wired to header J3.
#
# Use it explicitly, never by auto-discovery:
#
#   ESPTOOL_CFGFILE=tools/rad01_rev2_uart_esptool.cfg \
#     pio run -e impr-rad01-rev2-uart -t upload --upload-port /dev/ttyUSB0
#
# Do NOT rename this to esptool.cfg in the project root. custom_reset_sequence
# short-circuits esptool's reset-strategy selection entirely, including the
# USB-JTAG-Serial detection that Rev 1 relies on for native-USB flashing.
#
# Why a custom sequence is needed
# -------------------------------
# Rev 2's auto-reset is a pair of gate-driven 2N7002 N-MOSFETs:
#
#   MB_RTS --10k(R13)--> Q1.gate ; Q1.drain = ESP_CHIP_PU (EN)
#   MB_DTR --10k(R14)--> Q2.gate ; Q2.drain = MCU_BOOT   (IO0)
#
# Gate HIGH turns the FET on and pulls its line LOW. A USB-serial bridge drives
# its DTR#/RTS# pins LOW when the signal is asserted, so on this board:
#
#   RTS asserted (True)  -> pin LOW  -> Q1 off -> EN  released (HIGH)
#   RTS deasserted(False)-> pin HIGH -> Q1 on  -> EN  pulled LOW (reset)
#   DTR asserted (True)  -> pin LOW  -> Q2 off -> IO0 released (HIGH)
#   DTR deasserted(False)-> pin HIGH -> Q2 on  -> IO0 pulled LOW (bootloader)
#
# That is inverted on both lines relative to esptool's ClassicReset /
# UnixTightReset, which assume RTS asserted => EN LOW and DTR asserted => IO0
# LOW. The sequences below are the inverted equivalents. The waits are longer
# than esptool's defaults because C5 and C9 (1 uF each) against the ~5k pull-ups
# on EN and IO0 give a ~5 ms rise time.
#
# Caveat: with DTR/RTS wired, the board is held in reset whenever no software
# has the port open, because idle bridge outputs sit HIGH. Leaving those two
# wires off and using the S3/S1 buttons is the lower-risk option.

[esptool]
custom_reset_sequence = D1|R0|W0.15|D0|R1|W0.15|D1
custom_hard_reset_sequence = R0|W0.15|R1
