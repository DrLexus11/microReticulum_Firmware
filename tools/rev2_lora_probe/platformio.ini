; Standalone LoRa probe for a freshly assembled IMPR RAD-01 Rev 2.
;
; Deliberately not part of the firmware build: it must be able to run on a board
; whose radio is suspect, without provisioning, EEPROM state, or Reticulum.
[env:rev2-lora-probe]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 115200
monitor_speed = 115200
