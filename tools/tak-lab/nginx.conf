# Serve the OpenTAKServer UI and proxy its API.
#
# OTS itself only serves the API: / and /login are 404 while /api/status
# redirects, because the official installer puts nginx in front with the built
# UI as static files. This is that nginx, minus the TLS and certificate
# machinery a bench does not need.

server {
    listen 8182;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: every route that is not a file is index.html, or a
    # browser refresh anywhere but / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://host.docker.internal:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The UI keeps a live socket for map updates; without the upgrade headers
    # it falls back to polling or simply never updates.
    location /socket.io {
        proxy_pass http://host.docker.internal:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
