# LXMF propagation node for a command post. Copy to ~/.impr-tak/lxmd/config.
#
#   lxmd -p --config ~/.impr-tak/lxmd --rnsconfig ~/.reticulum
#
# Then take the destination hash it prints and give it to the bridge:
#
#   lxmd --status --config ~/.impr-tak/lxmd --rnsconfig ~/.reticulum
#   tools/cot_bridge.py ... --propagation-node <hash>
#
# Prove it with tools/tak_partition_check.py before trusting it.
#
# PR C's headline is "chat that survives a partition". The retry and the
# receipts were proven on hardware 2026-09-12; the third guarantee -- a direct
# delivery that fails being re-sent as PROPAGATED -- had nowhere to forward to,
# because no propagation node existed. Standing this one up showed the fallback
# was not merely unexercised but broken. See docs/TAKDeliveryPlan.md.
#
# It attaches to the *system* daemon (rrcd), not to the bridge's private
# instance. Two reasons: the bridge sets share_instance = No and owns its
# instance exclusively, so a second process cannot join it; and rrcd is the
# transport node that holds the UDP interfaces to the RADs, which is what makes
# this node reachable from the mesh rather than only from the bridge. The
# GROUP-destination hop problem that forced the bridge onto its own instance
# does not apply here -- propagation runs over SINGLE destinations and Links,
# which are routed.

[propagation]
  enable_node = yes

  node_name = Command post
  # A role, never a callsign: this string goes out in every announce.

  # 118 ms on air per announce at SF7/BW250/CR4:5, measured with
  # tools/position_budget.py. Twice an hour is 0.007% of wall clock -- far
  # below anything worth economising on, and it is what lets a node that has
  # been out of range rediscover the store without being told the hash.
  # Disaster-first: re-meshing speed is worth more than this much airtime.
  announce_interval = 30
  announce_at_start = yes

  # A second propagation node on a Rev 2 at the command post is the planned
  # follow-on, and these two should find each other without configuration.
  # Depth is cut from the default 6 because a store sync is not one packet:
  # peering with a node four LoRa hops away means paying for every message it
  # holds, over the slowest link in the fleet. Four covers the topology we
  # actually build.
  autopeer = yes
  autopeer_maxdepth = 4

  # 8 KB, against a default of 256. At SF7/BW250 a 256 KB message is minutes of
  # continuous air for one message, which on a shared disaster channel is not a
  # message, it is an outage. Everything on the LoRa requirement list fits well
  # inside 8 KB: chat is ~500 B, a marker ~500 B, a typed drawing ~584 B.
  # Images and data packages are explicitly the HaLow phase; revisit this then.
  propagation_message_max_accepted_size = 8

  # Same argument one level up. A sync that arrives with more than this is not
  # refused -- LXMF sends the smallest messages first and retries the rest --
  # so this bounds a single sync's airtime without losing anything.
  propagation_sync_max_accepted_size = 64

  # Proof-of-work stamps are a spam defence for a public network. This fleet is
  # closed and already authenticated by IFAC at the interface, so a stamp buys
  # no security here and costs exactly what we cannot spend: battery on a
  # handset and seconds before a message that may be urgent leaves at all.
  propagation_stamp_cost_target = 0
  propagation_stamp_cost_flexibility = 0
  peering_cost = 0

  # The deck has disk. The bound that matters on this node is per-message
  # airtime above, not total storage.
  message_storage_limit = 500

[lxmf]
  display_name = Command post propagation
  announce_at_start = yes

[logging]
  loglevel = 4
