# Reticulum configuration for the CoT bridge, which must own its own instance.
#
#   tools/cot_bridge.py --team Cyan --config ~/.impr-tak/bridge-rns
#
# Copy this to that directory as a file named `config`.
#
# This is a requirement, not a preference, and the bridge refuses to start
# without it. A GROUP destination is dropped above one hop, and a client of a
# shared Reticulum instance sits one hop behind the daemon that owns the
# interfaces -- so a peer one hop from the daemon is two hops from the bridge
# and every group packet dies on delivery. Measured 2026-09-11: the endpoint
# listened, the team address was correct, interface counters moved, and no CoT
# ever arrived. See docs/TAKNative.md, "A GROUP destination does not cross a
# hop".
#
# Peers therefore connect to *this* instance's interface, not to the system
# daemon's. Give it a port of its own.

[reticulum]
  # Nothing here relays for anyone else, and a GROUP packet is not routed in
  # any case, so transport buys nothing and costs a hop's worth of confusion.
  enable_transport = No

  # The whole point. Sharing would put the daemon back in the path.
  share_instance = No

  panic_on_interface_error = No

[logging]
  loglevel = 4

[interfaces]

  # Peers -- phones running Columba, other bridges -- connect here directly.
  # Port 4243 keeps this clear of the system daemon's 4242.
  [[Bridge direct TCP]]
    type = TCPServerInterface
    enabled = Yes
    listen_ip = 0.0.0.0
    listen_port = 4243

  # For a radio-attached bridge, give it the radio here instead of, or as well
  # as, the TCP server above -- again directly, so members are one hop away.
  #
  # [[RAD over serial]]
  #   type = RNodeInterface
  #   enabled = Yes
  #   port = /dev/ttyACM0
  #   frequency = 868000000
  #   bandwidth = 250000
  #   txpower = 17
  #   spreadingfactor = 7
  #   codingrate = 5
